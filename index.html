<style>
:root{--black:#000;--white:#fff;--ash:#a4a89f;--fluor:#d4ff1a;--font:"Jost","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--font);font-weight:350;font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased}
.page{position:relative;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;padding:clamp(28px,5vw,64px) max(20px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.page{padding-left:clamp(40px,6vw,88px);padding-right:clamp(40px,6vw,88px)}}
.wave{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.wave path{fill:none;stroke:var(--fluor);stroke-width:clamp(10px,1.35vw,18px);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2.4s cubic-bezier(.55,.05,.3,1) .3s backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.top,.mid,.bottom{position:relative;z-index:2}
h1{margin:0;font-weight:200;font-size:clamp(56px,11vw,150px);line-height:.95;letter-spacing:-.01em;text-wrap:balance}
.role{margin:24px 0 0;max-width:34ch;font-size:17px;color:var(--ash)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px 24px}
.soon{margin:0;font-weight:200;font-size:clamp(34px,6vw,84px);line-height:1;letter-spacing:-.01em;text-shadow:0 0 3px var(--black),0 0 10px var(--black),0 0 18px var(--black)}
.bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;font-size:16px}
.bottom a{color:var(--white);text-decoration:underline;text-decoration-color:var(--ash);text-decoration-thickness:1px;text-underline-offset:.28em}
.bottom a:hover{text-decoration-thickness:2px;text-decoration-color:var(--fluor)}
.bottom a:focus-visible{outline:2px solid var(--fluor);outline-offset:4px}
.bottom span{color:var(--ash)}
@media (prefers-reduced-motion:reduce){.wave path{animation:none}}
</style>
</head>
<body>
<main class="page">
  <svg class="wave" id="wave" aria-hidden="true" focusable="false"><path id="wave-path" pathLength="1" d="M0 0"/></svg>
  <header class="top">
    <div>
      <h1>Soledad<br>Imbach</h1>
      <p class="role">Artista visual, fotógrafa y autora. Eldorado, Misiones.</p>
    </div>
    <p class="soon">Próximamente</p>
  </header>
  <div class="mid"></div>
  <footer class="bottom">
    <a href="mailto:soledadimbach@gmail.com">soledadimbach@gmail.com</a>
    <span>Eldorado, Misiones, Argentina</span>
  </footer>
</main>
<script>
(function(){
  var page=document.querySelector(".page"),wave=document.getElementById("wave"),path=document.getElementById("wave-path");
  var REF=[[-9,350],[55,331],[138,298],[212,298],[276,298],[304,323],[276,348],[248,372],[212,405],[267,416],[340,430],[405,372],[414,306],[423,246],[451,210],[492,210],[552,210],[589,268],[644,292],[658,298],[672,301],[699,302]];
  function draw(){
    var W=page.clientWidth,H=page.scrollHeight,narrow=W<700;
    var yC=H*(narrow?0.52:0.57),yT=H*(narrow?0.84:0.88);
    wave.setAttribute("viewBox","0 0 "+W+" "+H);
    var pts=REF.map(function(p){return[(p[0]/680*W).toFixed(1),(yC+(p[1]-210)/220*(yT-yC)).toFixed(1)];});
    var d="M"+pts[0].join(" ");
    for(var i=1;i<pts.length;i+=3){d+=" C"+pts[i].join(" ")+" "+pts[i+1].join(" ")+" "+pts[i+2].join(" ");}
    path.setAttribute("d",d);
  }
  draw();
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(draw);}
  var t;window.addEventListener("resize",function(){clearTimeout(t);t=setTimeout(draw,120);});
})();
</script>
</body>
</html>
